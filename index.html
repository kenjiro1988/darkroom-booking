<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗室 予約システム</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; color: #333; }
        h1 { font-size: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; font-size: 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .slot-btn { display: inline-block; width: 30%; margin: 5px 1.5%; padding: 10px; text-align: center; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; border-radius: 4px; box-sizing: border-box; }
        .slot-btn.selected { background: #007bff; color: white; border-color: #007bff; }
        .slot-btn.disabled { background: #e9ecef; color: #adb5bd; cursor: not-allowed; border-color: #dee2e6; }
    </style>
</head>
<body>

    <h1>暗室 予約システム</h1>

    <div class="form-group">
        <label for="date">1. 予約日を選択</label>
        <input type="date" id="date">
    </div>

    <div class="form-group">
        <label>2. 時間枠を選択</label>
        <div id="slot-container">
            <!-- 予約状況に応じて動的に変わります -->
            <div class="slot-btn" data-slot="午前 (9:00-12:00)">午前<br><small>9:00-12:00</small></div>
            <div class="slot-btn" data-slot="午後1 (13:00-15:30)">午後1<br><small>13:00-15:30</small></div>
            <div class="slot-btn" data-slot="午後2 (15:45-18:15)">午後2<br><small>15:45-18:15</small></div>
            <div class="slot-btn" data-slot="夜間 (18:30-21:00)">夜間<br><small>18:30-21:00</small></div>
        </div>
    </div>

    <div class="form-group">
        <label for="machine">3. 引き伸ばし機を選択</label>
        <select id="machine">
            <option value="">-- 機種を選んでください --</option>
            <option value="機種A">機種A (LPL等)</option>
            <option value="機種B">機種B (FUJI等)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="option">4. オプション</label>
        <input type="text" id="option" placeholder="例: イーゼルマスク追加 など">
    </div>

    <div class="form-group">
        <label for="wsInfo">5. ワークショップ情報</label>
        <input type="text" id="wsInfo" placeholder="特になければ空欄でOK">
    </div>

    <button id="submit-btn" type="button">予約をリクエストする</button>

    <script>
        // あなたのGASのURLをセット済みです
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwgKC2RQBqOYICKugodV_gZP5oGE7UbyLMNXYOo5cpLCbHiBfOKOtWoTdQrmQ9I0cul/exec';

        let selectedSlot = '';
        let existingBookings = [];

        // ページ読み込み時に既存の予約データを取得
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(WEB_APP_URL);
                existingBookings = await response.json();
            } catch (e) {
                console.error('予約状況の取得に失敗しました', e);
            }
        });

        // 日付や機材が変わったときに埋まり具合をチェックする関数
        function updateSlotAvailability() {
            const currentDate = document.getElementById('date').value;
            const currentMachine = document.getElementById('machine').value;
            
            const slotBtns = document.querySelectorAll('.slot-btn');
            slotBtns.forEach(btn => {
                const slotName = btn.getAttribute('data-slot');
                
                // 既に同じ日・同じ機材・同じ時間枠で予約があるかチェック
                const isBooked = existingBookings.some(b => 
                    b.date === currentDate && 
                    b.machine === currentMachine && 
                    b.slot === slotName
                );

                if (isBooked) {
                    btn.classList.add('disabled');
                    btn.classList.remove('selected');
                    if (selectedSlot === slotName) selectedSlot = '';
                } else {
                    btn.classList.remove('disabled');
                }
            });
        }

        document.getElementById('date').addEventListener('change', updateSlotAvailability);
        document.getElementById('machine').addEventListener('change', updateSlotAvailability);

        // 時間枠ボタンのクリック処理
        document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('disabled')) {
                    alert('この時間枠のその機種はすでに予約されています。');
                    return;
                }
                document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedSlot = btn.getAttribute('data-slot');
            });
        });

        // 送信ボタンの処理
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const date = document.getElementById('date').value;
            const machine = document.getElementById('machine').value;
            const option = document.getElementById('option').value;
            const wsInfo = document.getElementById('wsInfo').value;

            if (!date || !selectedSlot || !machine) {
                alert('「日付」「時間枠」「引き伸ばし機」をすべて選択してください！');
                return;
            }

            const payload = {
                date: date,
                slot: selectedSlot,
                machine: machine,
                option: option,
                wsInfo: wsInfo
            };

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').textContent = '送信中...';

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('予約リクエストを受け付けました！');
                    location.reload();
                } else {
                    alert(result.message);
                    document.getElementById('submit-btn').disabled = false;
                    document.getElementById('submit-btn').textContent = '予約をリクエストする';
                }
            } catch (error) {
                alert('通信エラーが発生しました。もう一度お試しください。');
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').textContent = '予約をリクエストする';
            }
        });
    </script>
</body>
</html>
